name: Evaluate skills

on:
  workflow_dispatch:
    inputs:
      host:
        description: Model CLI
        type: choice
        options: [claude, codex]
        default: claude
        required: true
      model:
        description: Model identifier (blank uses sonnet or gpt-5.6-sol)
        type: string
      suite:
        description: Controlled evaluation suite
        type: choice
        options: [behavior, routing]
        default: behavior
        required: true
      case:
        description: Scenario ID (blank selects whole suite within max-runs)
        type: string
        default: apex-rejects-conflicting-tdd-and-no-test
      repeats:
        description: Repetitions (1..3)
        type: number
        default: 1
      max-runs:
        description: Maximum scenario runs (1..96)
        type: number
        default: 4
      max-calls:
        description: Maximum CLI turns, not provider requests (1..200)
        type: number
        default: 30
      budget-seconds:
        description: Run-loop budget (1..900 seconds, not a dollar cap)
        type: number
        default: 300

permissions:
  contents: read
concurrency:
  group: skill-evaluations
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: skill-evaluations
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies and selected CLI without credentials
        env:
          EVAL_HOST: ${{ inputs.host }}
        run: |
          bun install --frozen-lockfile
          case "$EVAL_HOST" in
            claude) npm install --global @anthropic-ai/claude-code@2.1.268 ;;
            codex) npm install --global @openai/codex@0.154.0 ;;
            *) exit 2 ;;
          esac
      - name: Validate evaluator
        run: |
          bun run typecheck
          bun run eval:check
          bun test tests/eval-engine.test.ts tests/eval-adapters.test.ts tests/eval-workflow.test.ts
      - name: Run controlled evaluations
        env:
          EVAL_HOST: ${{ inputs.host }}
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_SUITE: ${{ inputs.suite }}
          EVAL_CASE: ${{ inputs.case }}
          EVAL_REPEATS: ${{ inputs.repeats }}
          EVAL_MAX_RUNS: ${{ inputs.max-runs }}
          EVAL_MAX_CALLS: ${{ inputs.max-calls }}
          EVAL_BUDGET: ${{ inputs.budget-seconds }}
          ANTHROPIC_API_KEY: ${{ inputs.host == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          CODEX_API_KEY: ${{ inputs.host == 'codex' && secrets.CODEX_API_KEY || '' }}
        run: |
          if [ -z "$EVAL_MODEL" ]; then
            case "$EVAL_HOST" in
              claude) EVAL_MODEL=sonnet ;;
              codex) EVAL_MODEL=gpt-5.6-sol ;;
              *) exit 2 ;;
            esac
          fi
          args=(--execute --auth api-key --host "$EVAL_HOST" --model "$EVAL_MODEL"
            --suite "$EVAL_SUITE" --repeats "$EVAL_REPEATS" --max-runs "$EVAL_MAX_RUNS"
            --max-calls "$EVAL_MAX_CALLS" --budget-seconds "$EVAL_BUDGET"
            --max-steps 16 --timeout-seconds 60)
          if [ -n "$EVAL_CASE" ]; then args+=(--case "$EVAL_CASE"); fi
          bun run eval:skills "${args[@]}"
      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-evaluations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .eval-results/run-*/*.json
            .eval-results/run-*/report.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
