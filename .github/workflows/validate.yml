name: Validate catalogue

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogue-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run eval:check
      - run: bun run smoke:package
      - run: npx --yes skills@1.5.25 add . --list
      - run: bun run check:portability
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 -m unittest discover -s skills/apex -p 'test_*.py'
      - run: python3 -m unittest discover -s skills/peaklab.plane-do-issue -p 'test_*.py'
      - run: python3 -m unittest discover -s skills/peaklab.plane-api -p 'test_*.py'
      - run: python3 -m unittest discover -s skills/peaklab.plane-create-issue/scripts -p 'test_*.py'
      - run: python3 -m py_compile skills/peaklab.coolify-api/scripts/coolify.py skills/peaklab.plane-api/*.py
